<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>NCT 2026 Setlist 选择器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --neon: #ccff00;
    --neon-dim: #99cc00;
    --neon-glow: rgba(204, 255, 0, 0.25);
    --bg: #0a0a0a;
    --panel: #141414;
    --border: #2a2a2a;
    --text: #ffffff;
    --muted: #888888;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    color: var(--text); background: var(--bg);
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow: hidden;
  }

  /* ==================================================
     移动端
     ================================================== */
  .mobile-ui {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  .m-header {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top));
    border-bottom: 1px solid #1a1a1a;
    background: #0a0a0a;
  }
  .m-logo {
    width: 30px; height: 30px; flex: none;
    display: grid; place-items: center;
    background: var(--neon); color: #000;
    font-weight: 900; font-size: 14px;
    border-radius: 6px;
    box-shadow: 0 0 14px var(--neon-glow);
  }
  .m-title {
    flex: 1;
    font-size: 13px; font-weight: 800;
    letter-spacing: 0.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .m-title span { color: var(--neon); }
  .m-icon-btn {
    width: 32px; height: 32px; flex: none;
    background: #000; color: #ccc;
    border: 1px solid var(--border);
    border-radius: 7px;
    display: grid; place-items: center;
    font-size: 14px; font-weight: 800;
    cursor: pointer; padding: 0;
    font-family: inherit;
    transition: all .15s;
  }
  .m-icon-btn:active {
    border-color: var(--neon); color: var(--neon);
  }
  .m-icon-btn.primary {
    background: var(--neon); border-color: var(--neon); color: #000;
  }
  .m-icon-btn:disabled { opacity: 0.5; cursor: wait; }

  /* 标签栏 —— 放在顶部，先选标签 */
  .m-tabs {
    flex: none;
    display: flex;
    padding: 8px 12px;
    gap: 6px;
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
  }
  .m-tab {
    flex: 1;
    padding: 10px 10px;
    border: 1px solid var(--border);
    background: #000;
    color: #888;
    font-size: 13px; font-weight: 800;
    letter-spacing: 0.5px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    position: relative;
  }
  .m-tab.active {
    background: var(--neon);
    border-color: var(--neon);
    color: #000;
    box-shadow: 0 0 12px var(--neon-glow);
  }
  .m-tab .m-tab-badge {
    display: inline-block;
    margin-left: 5px;
    font-size: 10px;
    font-weight: 900;
    background: rgba(0,0,0,0.15);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .m-tab:not(.active) .m-tab-badge {
    background: rgba(204, 255, 0, 0.15);
    color: var(--neon);
  }

  /* ============== 曲目标签页内容 ============== */
  .m-songs-view {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* 已选曲目预览区 —— 只在曲目标签显示 */
  .m-preview {
    flex: none;
    height: 32vh;
    min-height: 140px;
    max-height: 280px;
    border-bottom: 1px solid #1a1a1a;
    background: #0d0d0d;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 10px;
  }
  .m-preview::-webkit-scrollbar { width: 4px; }
  .m-preview::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .m-preview-empty {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px;
    color: #555; font-size: 12px;
    text-align: center; line-height: 1.6;
  }
  .m-preview-empty strong { color: var(--neon); font-weight: 800; font-size: 13px; }

  .m-pv-song {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px;
    border-radius: 8px;
    border: 1px solid transparent;
    margin-bottom: 4px;
    transition: all .15s;
    background: #141414;
  }
  .m-pv-song.active {
    border-color: var(--neon);
    background: rgba(204, 255, 0, 0.06);
    box-shadow: 0 0 12px var(--neon-glow);
  }
  .m-pv-main {
    display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 0;
    cursor: pointer;
  }
  .m-pv-thumb {
    width: 34px; height: 34px; flex: none;
    border-radius: 5px;
    background: #222;
    display: grid; place-items: center;
    overflow: hidden;
    font-size: 13px; color: #444;
    border: 1px solid #2a2a2a;
  }
  .m-pv-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .m-pv-body { flex: 1; min-width: 0; }
  .m-pv-name {
    font-size: 12.5px; font-weight: 700;
    color: #ddd; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .m-pv-song.active .m-pv-name { color: var(--neon); }

  .m-pv-members {
    display: flex; gap: 3px; margin-top: 4px;
    align-items: center;
    overflow: hidden;
  }
  .m-pv-avatar {
    width: 18px; height: 18px; border-radius: 50%;
    background: #222; color: var(--neon);
    font-size: 9px; font-weight: 800;
    display: grid; place-items: center;
    overflow: hidden; flex: none;
    border: 1px solid #333;
  }
  .m-pv-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .m-pv-more {
    font-size: 9px; color: #666;
    margin-left: 2px;
    font-weight: 700;
  }
  .m-pv-none {
    font-size: 10px; color: #444;
    margin-top: 3px;
  }
  .m-pv-count {
    flex: none;
    font-size: 10px; font-weight: 800;
    color: #000;
    background: var(--neon);
    padding: 2px 7px;
    border-radius: 999px;
    margin-right: 2px;
  }
  .m-pv-count.limited { background: #ffcc00; }
  .m-pv-count.reached { background: #ff4444; color: #fff; }

  .m-pv-actions {
    flex: none;
    display: flex;
    gap: 2px;
    align-items: center;
  }
  .m-pv-btn {
    width: 26px; height: 26px;
    border-radius: 5px;
    border: 1px solid #2a2a2a;
    background: #000;
    color: #888;
    font-size: 12px; font-weight: 800;
    display: grid; place-items: center;
    cursor: pointer; padding: 0;
    font-family: inherit;
    transition: all .15s;
    line-height: 1;
  }
  .m-pv-btn:active {
    border-color: var(--neon);
    color: var(--neon);
  }
  .m-pv-btn.danger:active {
    border-color: #ff4444;
    color: #ff4444;
    background: #110000;
  }

  /* 搜索栏 */
  .m-search-bar {
    flex: none;
    padding: 8px 12px;
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
  }
  .m-search-wrap { position: relative; }
  .m-search {
    width: 100%;
    padding: 10px 12px 10px 34px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #000;
    color: var(--text);
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
  }
  .m-search::placeholder { color: #555; }
  .m-search:focus {
    border-color: var(--neon);
    box-shadow: 0 0 10px var(--neon-glow);
  }
  .m-search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: #555; font-size: 13px;
    pointer-events: none;
  }

  .m-filters {
    display: flex; gap: 4px;
    overflow-x: auto;
    padding: 8px 12px 8px;
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
    -webkit-overflow-scrolling: touch;
  }
  .m-filters::-webkit-scrollbar { display: none; }
  .m-filter {
    flex: none;
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: #888;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.5px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .m-filter.active {
    background: var(--neon);
    border-color: var(--neon);
    color: #000;
  }

  /* 列表 */
  .m-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 12px 20px;
    min-height: 0;
  }
  .m-list::-webkit-scrollbar { width: 4px; }
  .m-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  .m-item {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 11px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: #0e0e0e;
    margin-bottom: 5px;
    cursor: pointer;
    transition: all .15s;
  }
  .m-item:active { background: #181818; }
  .m-item.selected {
    border-color: var(--neon-dim);
    background: rgba(204, 255, 0, 0.06);
  }
  .m-item.in-current {
    border-color: var(--neon);
    background: rgba(204, 255, 0, 0.12);
  }
  .m-item.disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .m-item-thumb {
    width: 44px; height: 44px; flex: none;
    border-radius: 8px;
    background: #000;
    border: 1px solid #2a2a2a;
    display: grid; place-items: center;
    overflow: hidden;
    font-size: 15px; color: #555;
  }
  .m-item-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .m-item-body { flex: 1; min-width: 0; }
  .m-item-name {
    font-size: 13.5px; font-weight: 700;
    color: #ddd; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .m-item.selected .m-item-name,
  .m-item.in-current .m-item-name { color: var(--neon); }
  .m-item-tags {
    display: flex; gap: 4px; margin-top: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .m-tag {
    font-size: 9px; font-weight: 800;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #333;
    color: #888;
    letter-spacing: 0.5px;
  }
  .m-tag.t-127 { border-color: #3366ff; color: #6699ff; }
  .m-tag.t-dream { border-color: #00ccff; color: #33ddff; }
  .m-tag.t-wayv { border-color: #ffaa00; color: #ffcc33; }
  .m-tag.t-wish { border-color: #ff66cc; color: #ff99dd; }
  .m-tag.limit-tag {
    border-color: #ffcc00;
    color: #ffcc00;
    background: rgba(255, 204, 0, 0.08);
  }

  .m-item-badge {
    flex: none;
    min-width: 24px; height: 24px;
    padding: 0 7px;
    background: var(--neon);
    color: #000;
    font-size: 11px; font-weight: 900;
    border-radius: 5px;
    display: grid; place-items: center;
  }
  .m-item-state {
    flex: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1.5px solid #333;
    background: #000;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 800;
    color: transparent;
  }
  .m-item.in-current .m-item-state {
    background: var(--neon); border-color: var(--neon);
    color: #000;
  }

  .m-empty {
    padding: 40px 20px;
    text-align: center;
    color: #555;
    font-size: 12.5px;
    line-height: 1.7;
  }

  /* ============== 成员标签页内容 ============== */
  .m-members-view {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* 当前曲目条 —— 只在成员标签显示，精简版 */
  .m-current-hero {
    flex: none;
    padding: 12px 14px;
    background: linear-gradient(180deg, #121212, #0a0a0a);
    border-bottom: 1px solid #1a1a1a;
  }
  .m-current-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .m-current-label {
    font-size: 10px; font-weight: 800;
    color: var(--neon);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .m-current-count {
    font-size: 11px; font-weight: 800;
    color: #888;
    background: #1a1a1a;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .m-current-count.reached {
    color: #ff6666;
    background: rgba(255, 68, 68, 0.15);
  }
  .m-current-title {
    font-size: 17px; font-weight: 900;
    color: #fff;
    line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .m-current-none {
    text-align: center;
    padding: 20px 0;
    color: #666;
    font-size: 13px;
    line-height: 1.7;
  }
  .m-current-none strong { color: var(--neon); }
  .m-current-none-btn {
    margin-top: 12px;
    padding: 10px 20px;
    background: var(--neon);
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }

  /* 已选成员横向快捷显示 */
  .m-selected-strip {
    flex: none;
    display: flex; gap: 5px;
    padding: 10px 14px;
    background: #0a0a0a;
    border-bottom: 1px solid #1a1a1a;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 56px;
    align-items: center;
  }
  .m-selected-strip::-webkit-scrollbar { display: none; }
  .m-selected-empty {
    font-size: 11.5px; color: #555;
    padding: 6px 0;
  }
  .m-selected-chip {
    position: relative;
    flex: none;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px 4px 4px;
    background: rgba(204, 255, 0, 0.08);
    border: 1px solid var(--neon-dim);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: var(--neon);
    cursor: pointer;
  }
  .m-selected-chip .chip-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: #222; overflow: hidden;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 800;
    border: 1px solid #333;
  }
  .m-selected-chip .chip-avatar img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .m-selected-chip:active { background: rgba(204, 255, 0, 0.15); }

  /* ==================================================
     桌面端
     ================================================== */
  .desktop-ui { display: none; }

  @media (min-width: 820px) {
    .mobile-ui { display: none; }
    .desktop-ui {
      display: block;
      height: 100%;
      overflow-y: auto;
    }
  }

  .d-hero {
    background: #000;
    display: flex; justify-content: center; align-items: center;
    border-bottom: 1px solid #222;
    padding: 30px 20px;
  }
  .d-hero img { max-width: 700px; width: 100%; display: block; }
  .d-app { max-width: 1520px; margin: 0 auto; padding: 22px 22px 60px; }

  .d-topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .d-brand { display: flex; align-items: center; gap: 12px; }
  .d-logo {
    width: 42px; height: 42px;
    border-radius: 8px;
    display: grid; place-items: center;
    background: var(--neon); color: #000;
    font-size: 20px; font-weight: 900;
    box-shadow: 0 0 20px var(--neon-glow);
  }
  .d-brand h1 { margin: 0; font-size: 19px; font-weight: 900; }
  .d-brand h1 span { color: var(--neon); }
  .d-brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
  .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .d-btn {
    border: 1px solid var(--border);
    background: #000;
    color: var(--text);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 12.5px; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 0.5px;
  }
  .d-btn:hover { border-color: var(--neon); color: var(--neon); }
  .d-btn:disabled { opacity: 0.5; cursor: wait; }
  .d-btn.primary {
    background: var(--neon); border-color: var(--neon);
    color: #000; font-weight: 800;
    box-shadow: 0 0 14px var(--neon-glow);
  }
  .d-btn.primary:hover { background: #d4ff33; color: #000; }
  .d-btn.ghost { background: transparent; border-color: var(--neon); color: var(--neon); }

  .d-layout {
    display: grid;
    grid-template-columns: 300px 340px minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  .d-pool {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex; flex-direction: column;
    gap: 10px;
    max-height: calc(100vh - 140px);
  }
  .d-pool-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  .d-pool-head h2 {
    margin: 0;
    font-size: 13px; font-weight: 900;
    letter-spacing: 1.5px;
    color: var(--neon);
    text-transform: uppercase;
  }
  .d-counter {
    font-size: 10.5px; font-weight: 800;
    color: var(--neon);
    background: rgba(204, 255, 0, 0.1);
    padding: 3px 9px;
    border-radius: 4px;
    border: 1px solid var(--neon-dim);
    white-space: nowrap;
  }
  .d-counter.reached {
    color: #ff6666;
    border-color: #ff6666;
    background: rgba(255, 68, 68, 0.1);
  }
  .d-mini {
    padding: 4px 9px;
    border: 1px solid var(--border);
    background: #000;
    color: #ccc;
    font-size: 10.5px; font-weight: 800;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
    transition: all .15s;
  }
  .d-mini:hover { border-color: var(--neon); color: var(--neon); }
  .d-mini.danger { border-color: #441111; color: #ff4444; background: #110000; }
  .d-mini.danger:hover { border-color: #ff4444; }

  .d-hint {
    font-size: 11px; padding: 9px 11px;
    border-radius: 8px;
    background: rgba(204, 255, 0, 0.08);
    border: 1px solid var(--neon-dim);
    color: var(--neon);
    font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .d-hint.warn {
    background: rgba(255, 200, 0, 0.1);
    border-color: #ffcc00; color: #ffcc00;
  }
  .d-search {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #000;
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
  }
  .d-search::placeholder { color: #555; }
  .d-search:focus { border-color: var(--neon); box-shadow: 0 0 10px var(--neon-glow); }

  .d-teams { display: flex; gap: 4px; flex-wrap: wrap; }
  .d-team {
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: #888;
    font-size: 10.5px; font-weight: 800;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: all .15s;
  }
  .d-team:hover { border-color: var(--neon); color: var(--neon); }
  .d-team.active {
    background: var(--neon); border-color: var(--neon); color: #000;
  }

  .d-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 3px;
    margin: 0 -6px; padding: 0 6px;
  }
  .d-list::-webkit-scrollbar { width: 5px; }
  .d-list::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .d-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 9px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .15s;
  }
  .d-item:hover { background: #1a1a1a; }

function pad2(n){ return String(n).padStart(2,'0'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function roundRect(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function fitText(ctx, text, maxWidth, font){
  ctx.font = font;
  if (!text) return '';
  if (ctx.measureText(text).width <= maxWidth) return text;
  let lo=0, hi=text.length;
  while (lo<hi){
    const mid = Math.ceil((lo+hi)/2);
    if (ctx.measureText(text.slice(0,mid)+'…').width <= maxWidth) lo = mid;
    else hi = mid-1;
  }
  return text.slice(0,lo)+'…';
}

const imgCache = new Map();
function loadImage(src){
  if (!src) return Promise.resolve(null);
  if (imgCache.has(src)) return Promise.resolve(imgCache.get(src));
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { imgCache.set(src, img); resolve(img); };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function readImageFile(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSize / Math.max(w,h));
        w = Math.max(1, Math.round(w*scale));
        h = Math.max(1, Math.round(h*scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function load(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.setlist)) {
      d.songImages = d.songImages || {};
      d.memberImages = d.memberImages || {};
      if (typeof d.activeIndex !== 'number') d.activeIndex = d.setlist.length ? 0 : -1;
      return d;
    }
  } catch(e){}
  return null;
}

/* ============================================================
   ③ 状态操作
   ============================================================ */
function isMobile(){ return window.matchMedia('(max-width: 819px)').matches; }

function getSongLimit(songIndex){
  const song = SONG_POOL[songIndex];
  return song && song.limit ? song.limit : Infinity;
}

function selectSong(index){
  const pos = state.setlist.findIndex(it => it.song === index);
  if (pos >= 0) {
    state.activeIndex = pos;
  } else {
    state.setlist.push({ song: index, members: [] });
    state.activeIndex = state.setlist.length - 1;
  }
  save();
  if (isMobile()) {
    switchMobileTab('members');
  }
  renderAll();
}

function toggleMember(index){
  const target = state.setlist[state.activeIndex];
  if (!target) { alert('请先选择一首曲目'); return; }
  const pos = target.members.indexOf(index);
  if (pos >= 0) {
    target.members.splice(pos, 1);
  } else {
    const limit = getSongLimit(target.song);
    if (target.members.length >= limit) {
      const song = SONG_POOL[target.song];
      alert('「' + song.title + '」最多只能选 ' + limit + ' 人');
      return;
    }
    target.members.push(index);
  }
  save(); renderAll();
}

function removeSong(si){
  if (si < 0 || si >= state.setlist.length) return;
  const song = SONG_POOL[state.setlist[si].song];
  if (!confirm('确定要移除「' + (song ? song.title : '') + '」吗？')) return;
  state.setlist.splice(si, 1);
  if (!state.setlist.length) {
    state.activeIndex = -1;
  } else if (state.activeIndex >= state.setlist.length) {
    state.activeIndex = state.setlist.length - 1;
  } else if (si < state.activeIndex) {
    state.activeIndex--;
  }
  save(); renderAll();
}

function moveSongUp(si){
  if (si <= 0) return;
  const t = state.setlist[si - 1];
  state.setlist[si - 1] = state.setlist[si];
  state.setlist[si] = t;
  if (state.activeIndex === si) state.activeIndex = si - 1;
  else if (state.activeIndex === si - 1) state.activeIndex = si;
  save(); renderAll();
}

function moveSongDown(si){
  if (si >= state.setlist.length - 1) return;
  const t = state.setlist[si + 1];
  state.setlist[si + 1] = state.setlist[si];
  state.setlist[si] = t;
  if (state.activeIndex === si) state.activeIndex = si + 1;
  else if (state.activeIndex === si + 1) state.activeIndex = si;
  save(); renderAll();
}

function removeMemberFromSong(si, pos){
  const t = state.setlist[si];
  if (t) { t.members.splice(pos, 1); save(); renderAll(); }
}

function clearAll(){
  if (!state.setlist.length &&
      !Object.keys(state.songImages).length &&
      !Object.keys(state.memberImages).length) return;
  if (!confirm('确定要清空所有已选曲目、成员和图片吗？')) return;
  state.setlist = [];
  state.activeIndex = -1;
  state.songImages = {};
  state.memberImages = {};
  save(); renderAll();
}

/* ============================================================
   ④ 移动端渲染
   ============================================================ */
function switchMobileTab(tab){
  mobileTab = tab;
  const tabS = $('mTabSongs'), tabM = $('mTabMembers');
  const viewS = $('mSongsView'), viewM = $('mMembersView');
  if (!tabS || !tabM || !viewS || !viewM) return;

  if (tab === 'songs') {
    tabS.classList.add('active');
    tabM.classList.remove('active');
    viewS.style.display = 'flex';
    viewM.style.display = 'none';
  } else {
    tabM.classList.add('active');
    tabS.classList.remove('active');
    viewS.style.display = 'none';
    viewM.style.display = 'flex';
  }
}

function renderMobile(){
  if (!isMobile()) return;
  renderMobileTabBadge();
  if (mobileTab === 'songs') {
    renderMobilePreview();
    renderMobileSongList();
  } else {
    renderMobileCurrentHero();
    renderMobileSelectedStrip();
    renderMobileFilters();
    renderMobileMemberList();
  }
}

function renderMobileTabBadge(){
  const badge = $('mTabBadge');
  if (!badge) return;
  badge.textContent = String(state.setlist.length);
}

/* ---- 曲目视图 ---- */
function renderMobilePreview(){
  const mPreview = $('mPreview');
  if (!mPreview) return;
  if (!state.setlist.length) {
    mPreview.innerHTML =
      '<div class="m-preview-empty">' +
        '还没有选择曲目<br>' +
        '在下方<strong>曲目池</strong>点击加入' +
      '</div>';
    return;
  }
  let html = '';
  state.setlist.forEach((item, si) => {
    const song = SONG_POOL[item.song];
    if (!song) return;
    const songImg = state.songImages[item.song];
    const active = si === state.activeIndex;
    const limit = song.limit;

    let avatars = '';
    const showMax = 6;
    item.members.slice(0, showMax).forEach(mi => {
      const m = MEMBER_POOL[mi];
      const name = m ? m.name : '';
      const mImg = state.memberImages[mi];
      avatars +=
        '<span class="m-pv-avatar">' +
          (mImg ? '<img src="' + mImg + '" alt="" loading="lazy">' : esc((name||'?').charAt(0))) +
        '</span>';
    });
    if (item.members.length > showMax) {
      avatars += '<span class="m-pv-more">+' + (item.members.length - showMax) + '</span>';
    }
    if (!item.members.length) {
      avatars = '<span class="m-pv-none">未选成员</span>';
    }

    let countClass = 'm-pv-count';
    if (limit) {
      countClass += ' limited';
      if (item.members.length >= limit) countClass += ' reached';
    }
    const countText = limit
      ? item.members.length + '/' + limit
      : String(item.members.length);

    const upDisabled = si === 0 ? ' style="opacity:.3"' : '';
    const downDisabled = si === state.setlist.length - 1 ? ' style="opacity:.3"' : '';

    html +=
      '<div class="m-pv-song' + (active ? ' active' : '') + '" data-si="' + si + '">' +
        '<div class="m-pv-main" data-act="select">' +
          '<div class="m-pv-thumb">' +
            (songImg ? '<img src="' + songImg + '" alt="" loading="lazy">' : '♪') +
          '</div>' +
          '<div class="m-pv-body">' +
            '<div class="m-pv-name">' + pad2(si+1) + '. ' + esc(song.title) + '</div>' +
            '<div class="m-pv-members">' + avatars + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="' + countClass + '">' + countText + '</div>' +
        '<div class="m-pv-actions">' +
          '<button class="m-pv-btn" data-act="up" title="上移"' + upDisabled + '>↑</button>' +
          '<button class="m-pv-btn" data-act="down" title="下移"' + downDisabled + '>↓</button>' +
          '<button class="m-pv-btn danger" data-act="del" title="删除">✕</button>' +
        '</div>' +
      '</div>';
  });
  mPreview.innerHTML = html;

  const activeEl = mPreview.querySelector('.m-pv-song.active');
  if (activeEl) {
    const containerTop = mPreview.scrollTop;
    const containerBottom = containerTop + mPreview.clientHeight;
    const elTop = activeEl.offsetTop;
    const elBottom = elTop + activeEl.offsetHeight;
    if (elTop < containerTop || elBottom > containerBottom) {
      mPreview.scrollTop = elTop - 8;
    }
  }
}

function renderMobileSongList(){
  const mSongList = $('mSongList');
  const mSongSearch = $('mSongSearch');
  if (!mSongList || !mSongSearch) return;
  const q = mSongSearch.value.trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let shown = 0;

  SONG_POOL.forEach((song, i) => {
    if (q && !song.title.toLowerCase().includes(q)) return;
    shown++;

    const listPos = state.setlist.findIndex(it => it.song === i);
    const selected = listPos >= 0;
    const active = selected && listPos === state.activeIndex;
    const img = state.songImages[i];

    let tags = '';
    if (song.limit) {
      tags += '<span class="m-tag limit-tag">限' + song.limit + '人</span>';
    }

    const div = document.createElement('div');
    div.className = 'm-item' + (selected ? ' selected' : '') + (active ? ' in-current' : '');
    div.dataset.songIndex = i;
    div.innerHTML =
      '<div class="m-item-thumb">' +
        (img ? '<img src="' + img + '" alt="" loading="lazy">' : '♪') +
      '</div>' +
      '<div class="m-item-body">' +
        '<div class="m-item-name">' + esc(song.title) + '</div>' +
        (tags ? '<div class="m-item-tags">' + tags + '</div>' : '') +
      '</div>' +
      (selected
        ? '<div class="m-item-badge">' + pad2(listPos+1) + '</div>'
        : '<div class="m-item-state"></div>');
    frag.appendChild(div);
  });

  mSongList.innerHTML = '';
  if (!shown) mSongList.innerHTML = '<div class="m-empty">没有匹配的曲目</div>';
  else mSongList.appendChild(frag);
}

/* ---- 成员视图 ---- */
function renderMobileCurrentHero(){
  const hero = $('mCurrentHero');
  if (!hero) return;
  const item = state.setlist[state.activeIndex];
  if (!item) {
    hero.innerHTML =
      '<div class="m-current-none">' +
        '还没有选择曲目<br>' +
        '请先到 <strong>① 选曲目</strong> 添加' +
        '<br><button class="m-current-none-btn" data-act="goto-songs">去选曲目</button>' +
      '</div>';
    return;
  }
  const song = SONG_POOL[item.song];
  const limit = song && song.limit;
  const countText = limit
    ? item.members.length + ' / ' + limit

  hero.innerHTML =

      '<div class="m-current-label">CURRENT SONG</div>' +

function renderMobileSelectedStrip(){
  const strip = $('mSelectedStrip');
  if (!strip) return;
  const item = state.setlist[state.activeIndex];
  if (!item || !item.members.length) {
    strip.innerHTML = '<div class="m-selected-empty">点击下方成员加入本曲</div>';
    return;
  }
  let html = '';
  item.members.forEach((mi, k) => {
    const m = MEMBER_POOL[mi];
    const name = m ? m.name : '';
    const mImg = state.memberImages[mi];
    html +=
      '<div class="m-selected-chip" data-act="remove-member" data-pos="' + k + '">' +
        '<span class="chip-avatar">' +
          (mImg ? '<img src="' + mImg + '" alt="">' : esc((name||'?').charAt(0))) +
        '</span>' +
        '<span>' + esc(name.split(' ')[0] || name) + '</span>' +

function renderMobileFilters(){
  const mFilters = $('mFilters');
  if (!mFilters) return;
  mFilters.innerHTML = TEAMS.map(t =>
    '<button class="m-filter' + (currentTeam === t.key ? ' active' : '') +
    '" data-team="' + t.key + '">' + esc(t.label) + '</button>'
  ).join('');
}

function renderMobileMemberList(){
  const mMemberList = $('mMemberList');
  const mMemberSearch = $('mMemberSearch');
  if (!mMemberList || !mMemberSearch) return;

  const q = mMemberSearch.value.trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let shown = 0;
  const target = state.setlist[state.activeIndex];
  const inCurrent = target ? target.members : [];
  const limit = target ? getSongLimit(target.song) : Infinity;
  const isFull = target && target.members.length >= limit;

  MEMBER_POOL.forEach((member, i) => {
    if (currentTeam !== 'all' && !member.teams.includes(currentTeam)) return;
    if (q && !member.name.toLowerCase().includes(q)) return;
    shown++;

    const img = state.memberImages[i];
    const isIn = inCurrent.includes(i);
    const disabled = isFull && !isIn;

    const teamTags = member.teams.map(t => {
      const info = TEAMS.find(x => x.key === t);
      return '<span class="m-tag t-' + t + '">' + esc(info ? info.short : t) + '</span>';
    }).join('');

    const div = document.createElement('div');
    div.className = 'm-item' + (isIn ? ' in-current' : '') + (disabled ? ' disabled' : '');
    div.dataset.memberIndex = i;
    div.innerHTML =
      '<div class="m-item-thumb">' +
        (img ? '<img src="' + img + '" alt="" loading="lazy">' : esc(member.name.charAt(0))) +
      '</div>' +
      '<div class="m-item-body">' +
        '<div class="m-item-name">' + esc(member.name) + '</div>' +
        '<div class="m-item-tags">' + teamTags + '</div>' +
      '</div>' +
      '<div class="m-item-state">' + (isIn ? '✓' : '') + '</div>';
    frag.appendChild(div);
  });

  mMemberList.innerHTML = '';
  if (!shown) mMemberList.innerHTML = '<div class="m-empty">没有匹配的成员</div>';
  else mMemberList.appendChild(frag);
}

/* --- 移动端事件 --- */
function bindMobileEvents(){
  const mTabSongs = $('mTabSongs');
  const mTabMembers = $('mTabMembers');
  const mPreview = $('mPreview');
  const mSongList = $('mSongList');
  const mSongSearch = $('mSongSearch');
  const mMemberList = $('mMemberList');
  const mMemberSearch = $('mMemberSearch');
  const mFilters = $('mFilters');
  const mCurrentHero = $('mCurrentHero');
  const mSelectedStrip = $('mSelectedStrip');

  mTabSongs.addEventListener('click', () => {
    switchMobileTab('songs');
    renderAll();
  });
  mTabMembers.addEventListener('click', () => {
    switchMobileTab('members');
    renderAll();
  });

  /* 预览区操作 */
  mPreview.addEventListener('click', e => {
    const row = e.target.closest('.m-pv-song');
    if (!row) return;
    const si = Number(row.dataset.si);
    const actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      const a = actBtn.dataset.act;
      if (a === 'up') { moveSongUp(si); return; }
      if (a === 'down') { moveSongDown(si); return; }
      if (a === 'del') { removeSong(si); return; }
      if (a === 'select') {
        state.activeIndex = si;
        save();
        switchMobileTab('members');
        renderAll();
        return;
      }
    }
    /* 点其他区域也算选中 */
    state.activeIndex = si;
    save();
    switchMobileTab('members');
    renderAll();
  });

  /* 曲目列表点击 */
  mSongList.addEventListener('click', e => {
    const item = e.target.closest('.m-item');
    if (!item) return;
    selectSong(Number(item.dataset.songIndex));
  });

  mSongSearch.addEventListener('input', renderMobileSongList);

  /* 成员列表点击 */
  mMemberList.addEventListener('click', e => {
    const item = e.target.closest('.m-item');
    if (!item) return;
    if (item.classList.contains('disabled')) return;
    toggleMember(Number(item.dataset.memberIndex));
  });

  mMemberSearch.addEventListener('input', renderMobileMemberList);

  /* 队伍筛选 */
  mFilters.addEventListener('click', e => {
    const btn = e.target.closest('.m-filter');
    if (!btn) return;
    currentTeam = btn.dataset.team;
    renderMobileFilters();
    renderMobileMemberList();
  });

  /* 当前曲目条上的"去选曲目" */
  mCurrentHero.addEventListener('click', e => {
    if (e.target.dataset.act === 'goto-songs') {
      switchMobileTab('songs');
      renderAll();
    }
  });

  /* 已选成员快捷删除 */
  mSelectedStrip.addEventListener('click', e => {
    const chip = e.target.closest('.m-selected-chip');
    if (!chip) return;
    const pos = Number(chip.dataset.pos);
    const item = state.setlist[state.activeIndex];
    if (item) {
      item.members.splice(pos, 1);
      save(); renderAll();
    }
  });

  $('mBtnClear').addEventListener('click', clearAll);
  $('mBtnExport').addEventListener('click', exportImage);
  $('mBtnExportData').addEventListener('click', exportImageData);
}

        '还没有选择曲目<br>在左侧<strong>曲目池</strong>点击加入' +
      '</div>';

  }
  const frag = document.createDocumentFragment();
  state.setlist.forEach((item, si) => {
    const song = SONG_POOL[item.song];
    if (!song) return;
    const songImg = state.songImages[item.song];
    const limit = song.limit;
    const card = document.createElement('div');
    card.className = 'd-card' + (si === state.activeIndex ? ' active' : '');
    card.dataset.si = si;

    const reached = limit && item.members.length >= limit;
    const idxText = pad2(si+1) + ' / ' + item.members.length + (limit ? '/' + limit : '') + ' 人';

    const upDisabled = si === 0;
    const downDisabled = si === state.setlist.length - 1;

    let html =
      '<div class="d-card-head">' +
        '<div class="d-card-thumb" data-act="songimg">' +
          (songImg ? '<img src="' + songImg + '" alt="" loading="lazy">' : '♪') +
        '</div>' +
        '<div class="d-card-info">' +
          '<div class="d-card-idx' + (reached ? ' reached' : '') + '">' + idxText + '</div>' +
          '<div class="d-card-name">' + esc(song.title) + '</div>' +
        '</div>' +
        '<div class="d-card-actions">' +
          '<button class="d-card-btn" data-act="up"' + (upDisabled ? ' disabled style="opacity:.3;cursor:not-allowed"' : '') + ' title="上移">↑</button>' +
          '<button class="d-card-btn" data-act="down"' + (downDisabled ? ' disabled style="opacity:.3;cursor:not-allowed"' : '') + ' title="下移">↓</button>' +
          '<button class="d-card-btn danger" data-act="removesong" title="删除">✕</button>' +
        '</div>' +
      '</div>';

    if (item.members.length) {
      html += '<div class="d-member-grid">';
      item.members.forEach((mi, k) => {
        const m = MEMBER_POOL[mi];
        const name = m ? m.name : '';
        const mImg = state.memberImages[mi];
        html +=
          '<div class="d-member">' +
            '<span class="d-member-avatar">' +
              (mImg ? '<img src="' + mImg + '" alt="" loading="lazy">' : esc((name||'?').charAt(0))) +
            '</span>' +
            '<span class="d-member-name">' + esc(name) + '</span>' +
            '<button class="d-member-del" data-act="removemember" data-pos="' + k + '">✕</button>' +
          '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="d-member-empty">尚未选择成员</div>';
    }

    card.innerHTML = html;
    frag.appendChild(card);
  });
  dPreview.innerHTML = '';
  dPreview.appendChild(frag);
}

function bindDesktopEvents(){
  const dSongList = $('dSongList');
  const dMemberList = $('dMemberList');
  const dPreview = $('dPreview');
  const dSongSearch = $('dSongSearch');
  const dMemberSearch = $('dMemberSearch');
  const dTeamFilter = $('dTeamFilter');

  dSongList.addEventListener('click', e => {
    const item = e.target.closest('.d-item');
    if (!item) return;
    const index = Number(item.dataset.songIndex);
    const imgBtn = e.target.closest('[data-act="img"]');
    if (imgBtn) { e.stopPropagation(); openImagePicker('song', index); return; }
    selectSong(index);
  });

  dMemberList.addEventListener('click', e => {
    const item = e.target.closest('.d-item');
    if (!item) return;
    if (item.classList.contains('disabled')) return;
    const index = Number(item.dataset.memberIndex);
    const imgBtn = e.target.closest('[data-act="img"]');
    if (imgBtn) { e.stopPropagation(); openImagePicker('member', index); return; }
    toggleMember(index);
  });

  dPreview.addEventListener('click', e => {
    const card = e.target.closest('.d-card');
    if (!card) return;
    const si = Number(card.dataset.si);
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'up') { e.stopPropagation(); moveSongUp(si); return; }
      if (a === 'down') { e.stopPropagation(); moveSongDown(si); return; }
      if (a === 'removesong') { e.stopPropagation(); removeSong(si); return; }
      if (a === 'removemember') {
        e.stopPropagation();
        removeMemberFromSong(si, Number(act.dataset.pos));
        return;
      }
      if (a === 'songimg') {
        e.stopPropagation();
        const t = state.setlist[si];
        if (t) openImagePicker('song', t.song);
        return;
      }
    }
    state.activeIndex = si;
    save(); renderAll();
  });

  dSongSearch.addEventListener('input', renderDesktopSongList);
  dMemberSearch.addEventListener('input', renderDesktopMemberList);
  dTeamFilter.addEventListener('click', e => {
    const btn = e.target.closest('.d-team');
    if (!btn) return;
    currentTeam = btn.dataset.team;
    renderDesktopTeams();
    renderDesktopMemberList();
  });

  $('dBtnSelectAll').addEventListener('click', () => {
    const target = state.setlist[state.activeIndex];
    if (!target) { alert('请先选择一首曲目'); return; }
    const limit = getSongLimit(target.song);
    const q = dMemberSearch.value.trim().toLowerCase();
    MEMBER_POOL.forEach((m, i) => {
      if (currentTeam !== 'all' && !m.teams.includes(currentTeam)) return;
      if (q && !m.name.toLowerCase().includes(q)) return;
      if (target.members.includes(i)) return;
      if (target.members.length >= limit) return;
      target.members.push(i);
    });
    save(); renderAll();
  });

  $('dBtnClearMembers').addEventListener('click', () => {
    const target = state.setlist[state.activeIndex];
    if (!target) { alert('请先选择一首曲目'); return; }
    if (!target.members.length) return;
    if (!confirm('确定要移除该曲目的全部成员吗？')) return;
    target.members = [];
    save(); renderAll();
  });

  $('dBtnClear').addEventListener('click', clearAll);
  $('dBtnExport').addEventListener('click', exportImage);
  $('dBtnExportData').addEventListener('click', exportImageData);
}

/* ============================================================
   ⑥ 统一渲染
   ============================================================ */
function renderAll(){
  if (isMobile()) renderMobile();
  else renderDesktop();
}

/* ============================================================
   ⑦ 导出图片数据
   ============================================================ */
function exportImageData(){
  const songImgs = state.songImages;
  const memberImgs = state.memberImages;
  if (!Object.keys(songImgs).length && !Object.keys(memberImgs).length) {
    alert('还没有上传任何图片'); return;
  }
  let js = '/* 自动生成的图片数据文件 */\n';
  js += 'window.DEFAULT_SONG_IMAGES = ' + JSON.stringify(songImgs) + ';\n';
  js += 'window.DEFAULT_MEMBER_IMAGES = ' + JSON.stringify(memberImgs) + ';\n';
  const blob = new Blob([js], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'images-data.js';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert('已下载 images-data.js\n\n上传到网站根目录即可让所有人看到图片。');
}

/* ============================================================
   ⑧ 导出图片
   ============================================================ */
async function exportImage(){
  if (!state.setlist.length) { alert('请先选择曲目'); return; }

  const btns = [$('mBtnExport'), $('dBtnExport')].filter(Boolean);
  const oldTexts = btns.map(b => b.textContent);
  btns.forEach(b => { b.disabled = true; b.textContent = '生成中…'; });

  try {
    const tasks = [];
    state.setlist.forEach(item => {
      const sSrc = state.songImages[item.song];
      if (sSrc) tasks.push(loadImage(sSrc).catch(() => null));
      item.members.forEach(mi => {
        const mSrc = state.memberImages[mi];
        if (mSrc) tasks.push(loadImage(mSrc).catch(() => null));
      });
    });
    await Promise.all(tasks);
    drawAndDownload();
  } catch (err) {
    console.error(err);
    alert('导出失败：' + (err && err.message ? err.message : '未知错误'));
  } finally {
    btns.forEach((b, i) => { b.disabled = false; b.textContent = oldTexts[i]; });
  }
}

function drawAndDownload(){
  try {
    const W = 1080, PAD = 72;
    const CARD_PAD = 24, HEAD_ROW = 96, COLS = 3;
    const CELL_H = 60, CELL_GAP = 10, CARD_GAP = 18;
    const HEADER_H = 300;
    const URL_H = (CONFIG.url || '').trim() ? 110 : 60;
    const FOOTER_H = 40;

    let bodyH = 0;
    state.setlist.forEach(item => {
      bodyH += CARD_PAD * 2 + HEAD_ROW;
      const rows = Math.ceil(item.members.length / COLS);
      if (rows) bodyH += 16 + rows * CELL_H + (rows - 1) * CELL_GAP;
      bodyH += CARD_GAP;
    });
    const H = HEADER_H + bodyH + URL_H + FOOTER_H;

    let scale = 2;
    if (H > 2000) scale = 1.5;
    if (H > 3500) scale = 1;
    if (H > 6000) scale = 0.75;
    const MAX_PIXEL = 6000;
    if (H * scale > MAX_PIXEL) scale = MAX_PIXEL / H;
    if (W * scale > MAX_PIXEL) scale = Math.min(scale, MAX_PIXEL / W);
    scale = Math.max(0.6, scale);
    scale = Math.round(scale * 20) / 20;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    const barGrad = ctx.createLinearGradient(0, 0, W, 0);
    barGrad.addColorStop(0, '#ccff00');
    barGrad.addColorStop(1, '#99ff33');
    ctx.fillStyle = barGrad;
    ctx.fillRect(0, 0, W, 8);

    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#ccff00';
    ctx.lineWidth = 1;
    for (let i = -H; i < W + H; i += 40) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i + H, H);
      ctx.stroke();
    }
    ctx.restore();

    ctx.font = '900 22px ' + FONT;
    ctx.fillStyle = '#ccff00';
    ctx.fillText('S E T L I S T', PAD, 100);

    const titleFont = '900 72px ' + FONT;
    const title = (CONFIG.title || '').trim() || 'NCT 公演';
    ctx.font = titleFont;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(fitText(ctx, title, W - PAD * 2, titleFont), PAD, 180);

    const meta = [CONFIG.team, CONFIG.date, CONFIG.subtitle]
      .map(s => (s || '').trim()).filter(Boolean).join('  ·  ');
    if (meta) {
      const mf = '500 26px ' + FONT;
      ctx.font = mf;
      ctx.fillStyle = '#888888';
      ctx.fillText(fitText(ctx, meta, W - PAD * 2, mf), PAD, 240);
    }

    ctx.fillStyle = 'rgba(204, 255, 0, 0.3)';
    ctx.fillRect(PAD, 275, W - PAD * 2, 1);

    const contentW = W - PAD * 2;
    const innerW = contentW - CARD_PAD * 2;
    const cellW = (innerW - (COLS - 1) * CELL_GAP) / COLS;
    let y = HEADER_H;

    state.setlist.forEach((item, si) => {
      const song = SONG_POOL[item.song];
      if (!song) return;
      const rows = Math.ceil(item.members.length / COLS);
      const cardH = CARD_PAD * 2 + HEAD_ROW +
                    (rows ? 16 + rows * CELL_H + (rows - 1) * CELL_GAP : 0);

      roundRect(ctx, PAD, y, contentW, cardH, 16);
      ctx.fillStyle = '#141414';
      ctx.fill();
      ctx.strokeStyle = '#ccff00';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      roundRect(ctx, PAD, y + 12, 4, cardH - 24, 2);
      ctx.fillStyle = '#ccff00';
      ctx.fill();

      const imgSize = 76;
      const ix = PAD + CARD_PAD + 12;
      const iy = y + CARD_PAD + (HEAD_ROW - imgSize) / 2;
      const songImg = imgCache.get(state.songImages[item.song]);

      ctx.save();
      roundRect(ctx, ix, iy, imgSize, imgSize, 10);
      ctx.clip();
      if (songImg) ctx.drawImage(songImg, ix, iy, imgSize, imgSize);
      else { ctx.fillStyle = '#1e1e1e'; ctx.fillRect(ix, iy, imgSize, imgSize); }
      ctx.restore();

      if (!songImg) {
        ctx.save();
        ctx.font = '32px ' + FONT;
        ctx.fillStyle = '#444444';
        ctx.textAlign = 'center';
        ctx.fillText('♪', ix + imgSize / 2, iy + imgSize / 2);
        ctx.textAlign = 'left';
        ctx.restore();
      }

      const textX = ix + imgSize + 22;
      const textMaxW = PAD + contentW - CARD_PAD - textX - 130;

      ctx.font = '900 22px ' + FONT;
      ctx.fillStyle = '#ccff00';
      ctx.fillText(pad2(si + 1), textX, y + CARD_PAD + 24);

      const nameFont = '800 32px ' + FONT;
      ctx.font = nameFont;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(fitText(ctx, song.title, textMaxW, nameFont), textX, y + CARD_PAD + 60);

      const limit = song.limit;
      const countText = limit
        ? item.members.length + ' / ' + limit + ' 人'
        : item.members.length + ' 人';
      ctx.font = '800 20px ' + FONT;
      const reached = limit && item.members.length >= limit;
      ctx.fillStyle = reached ? '#ff4444' : '#ccff00';
      const cw = ctx.measureText(countText).width;
      ctx.fillText(countText, PAD + contentW - CARD_PAD - cw, y + CARD_PAD + 26);

      if (item.members.length) {
        const gridTop = y + CARD_PAD + HEAD_ROW + 16;
        item.members.forEach((mi, k) => {
          const col = k % COLS;
          const row = Math.floor(k / COLS);
          const cx = PAD + CARD_PAD + col * (cellW + CELL_GAP);
          const cy = gridTop + row * (CELL_H + CELL_GAP);

          roundRect(ctx, cx, cy, cellW, CELL_H, 10);
          ctx.fillStyle = 'rgba(204, 255, 0, 0.06)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(204, 255, 0, 0.25)';
          ctx.lineWidth = 1;
          ctx.stroke();

          const ar = 18;
          const acx = cx + 14 + ar;
          const acy = cy + CELL_H / 2;
          const mImg = imgCache.get(state.memberImages[mi]);
          const m = MEMBER_POOL[mi];
          const name = m ? m.name : '';

          ctx.save();
          ctx.beginPath();
          ctx.arc(acx, acy, ar, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();
          if (mImg) ctx.drawImage(mImg, acx - ar, acy - ar, ar * 2, ar * 2);
          else { ctx.fillStyle = '#222222'; ctx.fillRect(acx - ar, acy - ar, ar * 2, ar * 2); }
          ctx.restore();

          if (!mImg) {
            ctx.save();
            ctx.font = '800 18px ' + FONT;
            ctx.fillStyle = '#ccff00';
            ctx.textAlign = 'center';
            ctx.fillText((name || '?').charAt(0), acx, acy);
            ctx.textAlign = 'left';
            ctx.restore();
          }

          const nameX = acx + ar + 12;
          const nameW = cx + cellW - 14 - nameX;
          const mf = '700 20px ' + FONT;
          ctx.font = mf;
          ctx.fillStyle = '#ccff00';
          ctx.fillText(fitText(ctx, name, nameW, mf), nameX, acy);
        });
      }

      y += cardH + CARD_GAP;
    });

    const url = (CONFIG.url || '').trim();
    y += 20;

    if (url) {
      ctx.fillStyle = 'rgba(204, 255, 0, 0.2)';
      ctx.fillRect(PAD, y, W - PAD * 2, 1);

      ctx.font = '700 20px ' + FONT;
      ctx.fillStyle = '#666666';
      ctx.fillText('生成自', PAD, y + 46);

      const urlFont = '800 26px ' + FONT;
      ctx.font = urlFont;
      ctx.fillStyle = '#ccff00';
      ctx.fillText(fitText(ctx, url, W - PAD * 2 - 190, urlFont), PAD + 76, y + 46);

      ctx.font = '700 20px ' + FONT;
      ctx.fillStyle = '#444444';
      const footText = 'NCT SETLIST';
      const fw = ctx.measureText(footText).width;
      ctx.fillText(footText, W - PAD - fw, y + 46);
    }

    let dataUrl = '';
    try { dataUrl = canvas.toDataURL('image/png'); } catch(e){ dataUrl = ''; }
    if (!dataUrl || dataUrl.length < 100) {
      try { dataUrl = canvas.toDataURL('image/jpeg', 0.92); } catch(e){ dataUrl = ''; }
    }
    if (!dataUrl || dataUrl.length < 100) {
      alert('导出失败：内容太多。请减少曲目或成员数量。');
      return;
    }

    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = ((CONFIG.title || 'NCT公演') + '_setlist').replace(/[\\/:*?"<>|]/g, '_') + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  } catch (err) {
    console.error(err);
    alert('导出出错：' + (err && err.message ? err.message : '未知错误'));
  }
}

/* ============================================================
   ⑨ 启动
   ============================================================ */
function loadDefaultImages(){
  return new Promise(resolve => {
    const script = document.createElement('script');
    script.src = 'images-data.js';
    script.onload = resolve;
    script.onerror = resolve;
    document.head.appendChild(script);
  });
}

(async function init(){
  try {
    await loadDefaultImages();

    const saved = load();
    if (saved) {
      state.setlist = saved.setlist.filter(it =>
        it && typeof it.song === 'number' && it.song >= 0 && it.song < SONG_POOL.length
      ).map(it => ({
        song: it.song,
        members: (Array.isArray(it.members) ? it.members : [])
          .filter(m => typeof m === 'number' && m >= 0 && m < MEMBER_POOL.length)
      }));
      state.songImages = saved.songImages || {};
      state.memberImages = saved.memberImages || {};
      state.activeIndex = state.setlist.length
        ? Math.min(Math.max(saved.activeIndex || 0, 0), state.setlist.length - 1)
        : -1;
    }

    state.songImages = Object.assign({}, DEFAULT_SONG_IMAGES, window.DEFAULT_SONG_IMAGES || {}, state.songImages);
    state.memberImages = Object.assign({}, DEFAULT_MEMBER_IMAGES, window.DEFAULT_MEMBER_IMAGES || {}, state.memberImages);

    bindMobileEvents();
    bindDesktopEvents();

    /* 移动端默认标签：有已选曲目则去成员，否则留在曲目 */
    if (isMobile()) {
      if (state.setlist.length && state.activeIndex >= 0) {
        switchMobileTab('members');
      } else {
        switchMobileTab('songs');
      }
    }

    renderAll();
  } catch(err) {
    console.error('初始化失败：', err);
  }
})();

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    /* 切换设备时确保当前视图正确 */
    if (isMobile()) {
      switchMobileTab(mobileTab);
    }
    renderAll();
  }, 150);
});
